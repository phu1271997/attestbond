<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AttestBond — stake-backed public claims, judged on-chain</title>
  <meta name="description" content="Stake GEN behind a public claim about your project. GenLayer validators read the live sources and rule SUPPORTED or REFUTED, building a money-backed reputation." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311171c'/%3E%3Cpath d='M32 12l16 6v12c0 11-7 18-16 22-9-4-16-11-16-22V18z' fill='none' stroke='%237c6cff' stroke-width='4'/%3E%3Cpath d='M24 32l6 6 11-12' fill='none' stroke='%2346d39a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#11171c"/><path d="M32 12l16 6v12c0 11-7 18-16 22-9-4-16-11-16-22V18z" fill="none" stroke="#7c6cff" stroke-width="4"/><path d="M24 32l6 6 11-12" fill="none" stroke="#46d39a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <h1>AttestBond</h1>
          <div class="net">STUDIONET · 61999 · GENLAYER</div>
        </div>
      </div>
      <div class="wallet" id="wallet"></div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-view="board" class="active">Attestations</button>
      <button data-view="file">File an attestation</button>
      <button data-view="reputation">Reputation lookup</button>
      <button data-view="account">My account</button>
    </nav>

    <main id="view"></main>

    <div class="foot">
      AttestBond is a register of money-backed public claims. Verdicts and reputation are
      produced by GenLayer validator consensus, not by this site.
      <span id="contract-foot"></span>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
