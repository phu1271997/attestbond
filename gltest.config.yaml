# gltest network configuration.
#
#   source ~/.genlayer/env.sh      # exports GENLAYER_PRIVATE_KEY[_2.._4]
#   gltest --network studionet tests/
#
# Keys are read from the shell environment (never committed). studionet is the
# Studio-hosted network (chain 61999). The hosted RPC does NOT expose
# sim_installMocks / sim_fundAccount, so the StudioNet e2e suite uses the four
# pre-funded keys below and drives verdicts with real public sources judged by
# the live LLM jury. Deterministic, content-controlled invariants run in the
# in-process direct VM (tests/test_attestbond.py).
networks:
  default: studionet
  studionet:
    accounts:
      - ${GENLAYER_PRIVATE_KEY}
      - ${GENLAYER_PRIVATE_KEY_2}
      - ${GENLAYER_PRIVATE_KEY_3}
      - ${GENLAYER_PRIVATE_KEY_4}
    from: ${GENLAYER_PRIVATE_KEY}
    default_wait_interval: 5000
    default_wait_retries: 200
paths:
  contracts: contracts
